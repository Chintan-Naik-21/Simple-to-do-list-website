<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Todo List</h1>
            <p class="subtitle">Keep track of your tasks</p>
        </header>

        <div class="input-section">
            <input
                type="text"
                id="todoInput"
                placeholder="What needs to be done?"
                aria-label="New todo input"
            >
            <button id="addBtn" aria-label="Add todo">Add Todo</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="todo-list-container">
            <div id="emptyState" class="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 11l3 3L22 4"></path>
                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
                </svg>
                <h2>No todos yet</h2>
                <p>Add a new task to get started</p>
            </div>
            <ul id="todoList" class="todo-list"></ul>
        </div>

        <footer class="todo-footer">
            <span id="todoCount" class="todo-count">0 items left</span>
            <button id="clearCompleted" class="clear-btn">Clear Completed</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
